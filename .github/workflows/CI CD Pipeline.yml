name: CI/CD Pipeline

on:
   push:
      branches: [ main, feature/* ]
   pull_request:
      branches: [ main ]

jobs:
   test:
      runs-on: ubuntu-latest
      
      steps:
      - name: 🔍 Checkout code
      uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
         python-version: '3.11'
      
      - name: 📦 Install dependencies
      run: |
         pip install -r app/requirements.txt
         pip install pytest requests
      
      - name: 🧪 Run tests
      run: |
         echo "Running basic tests..."
         python -m pytest tests/ -v || echo "No tests found yet"
      
   build:
      needs: test
      runs-on: ubuntu-latest
      
      steps:
      - name: 🔍 Checkout code
      uses: actions/checkout@v4
      
      - name: 🔨 Build Docker image
      run: |
         docker build -t devops-lab-api:${{ github.sha }} .
      
      - name: 🧪 Test Docker container
      run: |
         docker run -d -p 5000:5000 --name test-api devops-lab-api:${{ github.sha }}
         sleep 5
         curl -f http://localhost:5000/health || exit 1
         docker stop test-api
         docker rm test-api
      
      - name: ✅ Build successful
      run: echo "Docker image built and tested successfully!"
